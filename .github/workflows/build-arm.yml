name: Build ARM Docker Images (backend + ui)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_backend:
        description: Build + push the backend ARM image
        type: boolean
        default: true
      build_ui:
        description: Build + push the UI ARM image
        type: boolean
        default: true

# Job graph (OPS-10): a `changes` job detects which areas a push touched and gates the
# fast checks — backend-test runs only when backend/** (or a contract/config input of
# its suite) changed, ui-validate when ui/** OR the backend contract files the UI
# consumes changed, ledger-guard when docs/** or the guard script changed. The ONE
# ungated check is contract-guard (OPS-38, council HK-13): it runs on every push —
# a contract's enumerated artifacts need not live under contracts/, so a path gate can
# skip the very edit the drift rule exists to catch. Docs-only ledger commits (the most
# frequent kind) still skip the test suites; they pay only for the two stdlib guards.
# The slow QEMU arm/v7 image builds (~14 min for the UI) remain
# MANUAL ONLY (`gh workflow run "Build ARM Docker Images (backend + ui)"` or the Actions
# "Run workflow" button), now with per-image toggles; a dispatch also forces the matching
# fast checks, since each image build `needs` its green gate — and the contract guard,
# whose staleness step tightens to a minor-or-major family gap on a dispatch (OPS-39).

# A newer push cancels the previous run's still-in-flight fast checks. The event name is
# part of the group so a push never cancels a manually dispatched image build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------- what changed? ---
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
      ledger: ${{ steps.filter.outputs.ledger }}
      workbench_plugin: ${{ steps.filter.outputs.workbench_plugin }}
    steps:
      # Full history: a multi-commit push must diff against the push base, not HEAD~1.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # the config tree (root config/ since CORE-11) feeds the backend suite's
              # drift guard (test_contracts_golden) + config-consuming tests, so a
              # config change must run the backend job.
              - 'config/**'
              # committed contract artifacts (VWB-15): the backend suite carries
              # layer 2 for every contract here — the catalog drift guard
              # (test_contracts_golden), the device-integration owner guard
              # (test_device_integration_schema), the pin conformance tests
              # (test_report_protocol_pin, test_core_py_pin_identity) — so any move
              # under contracts/ (an artifact, a STAMP, a pin) must run it. Every
              # STAMP-enumerated artifact lives under contracts/ today; an owned
              # artifact homed elsewhere must be added to this list in the same
              # change that enumerates it (OPS-38, HK-13: layer 2 runs when a
              # contract moves).
              - 'contracts/**'
              # the docs manifest: validated against the schema under contracts/ by
              # test_docs_manifest, but it lives outside both trees above.
              - 'docs/manifest.json'
              # the Workbench plugin files test_workbench_pin reads: the manifest
              # source it validates against the pinned manifest-fragment schema
              # (UI-22), and the configuration + imports that keep the plugin
              # compiling against the pinned contract.ts (UI-23).
              - 'workbench-plugin/manifest.fragment.json'
              - 'workbench-plugin/package.json'
              - 'workbench-plugin/package-lock.json'
              - 'workbench-plugin/tsconfig.json'
              - 'workbench-plugin/vite.config.ts'
              - 'workbench-plugin/src/**'
              - '.github/workflows/build-arm.yml'
            ui:
              # ui/ plus the backend contract it consumes (openapi.json for codegen,
              # config/ for device-state mapping + device configs) — a backend-side
              # contract change must re-validate the UI (config-ui-stays-functional).
              - 'ui/**'
              - 'backend/openapi.json'
              - 'config/**'
              - '.github/workflows/build-arm.yml'
            ledger:
              - 'docs/**'
              - 'scripts/scope_guard.py'
              - '.scope-guard.toml'
              # the guard's claudemd hash rule (OPS-16) checks the pinned blocks in here
              - 'CLAUDE.md'
            workbench_plugin:
              # the plugin consumes the backend OpenAPI contract the same way ui/
              # does (gen:api-types), so a contract change re-validates it too.
              - 'workbench-plugin/**'
              - 'backend/openapi.json'
              # the pinned plugin contract (UI-22): the plugin type-checks against
              # these bytes (UI-23), so a re-pin re-runs the type-check and build.
              - 'contracts/pins/workbench/**'
              - '.github/workflows/build-arm.yml'

  # ------------------------------- fast checks (gated, except contract-guard) ---
  ledger-guard:
    # docs/action_plan.md{,_DONE} single-source-of-scope check (single-task-ledger
    # invariant; DOC-4, cut over to the commons scope-guard by OPS-22 — vendored at
    # scope-v7.3.1 since OPS-40, config in .scope-guard.toml). Standalone job: scope drift lives in
    # docs/, and docs-only commits skip backend-test — the guard must not ride a job
    # that gets skipped.
    name: Ledger scope-drift guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ledger == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/scope_guard.py --config .scope-guard.toml

  contract-guard:
    # Layer-1 contract coherence (OPS-23, PROD-16/HK-5; convention:
    # locveil-commons/process/contracts.md §4 — vendored at contract-guard-v4.0.0 since
    # OPS-39, the scope-guard consumption model; every vendored tool's tag + sha256 is
    # recorded in .repin.toml). Checks the contracts/ layout, STAMP/PIN cores,
    # pinned-copy hashes, declared artifacts and their byte-lock to the tag, pin
    # completeness, reserved names, resolving pointers and the registry's version
    # strings; semantics stay in the backend suite's conformance tests. Local-only by
    # design — it never reaches across repos. Strict here — no --relax-tags: the pushed
    # tag must exist (the hook relaxes, CI doesn't).
    # UNGATED since OPS-38 (council HK-13, contracts.md §4): no `needs: changes`, no
    # path filter — every push, pull request and dispatch runs it, repin step included.
    name: Contract coherence guard
    runs-on: ubuntu-latest
    steps:
      # Full history: touch-the-family diffs against the push base, and the guard's
      # byte-lock rules read artifacts at their tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Never rely on the checkout's own tag handling — fetch them explicitly.
      - name: Fetch tags
        run: git fetch --tags --force origin
      - name: "contract-guard --check (layer 1, strict)"
        run: python3 scripts/contract_guard.py --check
      # Staleness ladder (contracts.md §5; repin vendored at repin-v2.0.0 since OPS-39).
      # Ordinary push / pull request: fail on a MAJOR family gap or a never-pinned
      # family, plus touch-the-family — a push that changes a pin folder or its
      # conformance test while that pin trails fails on ANY gap. Image dispatch (the
      # release path): fail on a MINOR-or-major family gap. Patch gaps and vendored-tool
      # version gaps only warn at both levels — a commons tool tag never blocks a
      # hotfix image; a locally edited vendored tool (sha256 mismatch) always fails.
      # A dispatch has no push base, so --touched gets an empty value and is skipped.
      - name: "repin --check (staleness: major + touch-the-family; minor on dispatch)"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          LEVEL: ${{ github.event_name == 'workflow_dispatch' && 'minor' || 'major' }}
        run: python3 scripts/repin.py --check --fail-on "$LEVEL" --touched "$BASE"

  backend-test:
    name: Backend tests (amd64)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_backend)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      # All three Python health gates (import-linter / check-no-type-checking
      # / pyright) run via the shared composite action in droman42/py-dev-gates.
      # The action handles its own python setup + install of the project's
      # [dev] extras; tests run separately below.
      - uses: droman42/py-dev-gates/.github/actions/python-health@v0.1.1
        with:
          src: src/locveil_bridge
          working-directory: backend
      - name: Run tests
        run: pytest -v -m "not requires_device" --tb=short

  ui-validate:
    name: UI validate (typecheck + lint + orphans + build)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_ui)
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Verify backend contract present
        working-directory: .
        run: ls -la backend/openapi.json
      - name: Generate API types from backend contract
        # Build needs api.gen.ts; openapi.json is committed so this is
        # deterministic. Same step runs locally on `npm run gen:api-types`.
        run: npm run gen:api-types
      - name: Check (typecheck + lint + orphans)
        # `check` now includes check:orphans (node scripts/find-orphans.mjs),
        # the static-import-graph walker that fails on any module unreachable
        # from src/app/main.tsx + src/app/App.tsx + any test file.
        run: npm run check
      - name: Build
        # Hard-fail at build time. `tsc && vite build` catches type/import
        # regressions that `tsc --noEmit` (in `check`) doesn't see at the
        # bundle level (e.g. circular imports that defer resolution).
        run: npm run build
      # NOTE: `npm test` (jest) intentionally NOT wired -- the project ships
      # zero test files today + the jest preset is misconfigured. Adding the
      # step would either silently pass (no tests collected) or block CI on
      # honest-red noise. Re-enable once the test framework is on its feet
      # (likely a vitest migration; see CONTRIBUTING for the deferral note).

  workbench-plugin-validate:
    # OPS-34 (PROD-26; HK-12 round-2 finding — the plugin had zero CI coverage).
    # Typecheck + build. Two commons surfaces, consumed two different ways:
    # - the Workbench plugin CONTRACT (types + schemas) comes from the pin at
    #   contracts/pins/workbench/ (UI-22, family `workbench` in .repin.toml) and
    #   from nowhere else: tsconfig.json maps `locveil-workbench/contract` to the
    #   pinned contract.ts and no `locveil-workbench` package is installed
    #   (UI-23). A commons change to the contract reaches this job only through
    #   a deliberate re-pin.
    # - locveil-ui-kit is a package-style surface with no pinned bytes — the
    #   shell's import-map singleton at runtime, a file: dep two levels up
    #   (`../../locveil-commons/packages/ui-kit`) at build time. That is the one
    #   reason this job lays out bridge + commons as SIBLING checkouts and builds
    #   ui-kit first (its package exports point at an uncommitted dist/); commons
    #   rides its default branch for it.
    # Two closing steps tie build and pin together: the emitted manifest must
    # equal the source the backend suite validated against the pinned schema,
    # and the compiler's own file list must show the pinned contract.ts and
    # nothing from the commons checkout but ui-kit.
    name: Workbench plugin validate (typecheck + build)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workbench_plugin == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          path: locveil-bridge
      - uses: actions/checkout@v6
        with:
          repository: locveil/locveil-commons
          path: locveil-commons
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            locveil-bridge/workbench-plugin/package-lock.json
            locveil-commons/packages/ui-kit/package-lock.json
      - name: "Build ui-kit (the commons file: dep)"
        working-directory: locveil-commons/packages/ui-kit
        run: |
          npm ci
          npm run build
      - name: Install plugin dependencies
        working-directory: locveil-bridge/workbench-plugin
        run: npm ci
      - name: Generate API types from backend contract
        working-directory: locveil-bridge/workbench-plugin
        run: npm run gen:api-types
      - name: Typecheck
        working-directory: locveil-bridge/workbench-plugin
        run: npm run typecheck
      - name: Build
        working-directory: locveil-bridge/workbench-plugin
        run: npm run build
      - name: "Emitted manifest equals its validated source"
        # test_workbench_pin (backend suite) validates manifest.fragment.json +
        # package.json's version against the pinned schema; this proves the build
        # emitted exactly that merge.
        working-directory: locveil-bridge/workbench-plugin
        run: |
          python3 - <<'PY'
          import json, sys
          source = json.load(open("manifest.fragment.json"))
          version = json.load(open("package.json"))["version"]
          expected = {"id": source["id"], "version": version,
                      **{k: v for k, v in source.items() if k != "id"}}
          emitted = json.load(open("dist/manifest.json"))
          if emitted != expected:
              print("dist/manifest.json differs from manifest.fragment.json + package.json version")
              print("emitted: ", json.dumps(emitted, sort_keys=True))
              print("expected:", json.dumps(expected, sort_keys=True))
              sys.exit(1)
          print("ok: emitted manifest is the validated source")
          PY
      - name: "Contract types compile from the pinned file"
        # The compiler's own answer to "which contract did this type-check read?".
        # test_workbench_pin (backend suite) holds the configuration in place — the
        # tsconfig mapping, no locveil-workbench dependency, type-only imports;
        # this is the end-to-end proof on the real program: the pinned contract.ts
        # is in it, and the commons checkout contributes ui-kit files only.
        working-directory: locveil-bridge/workbench-plugin
        run: |
          npx tsc --listFilesOnly > "$RUNNER_TEMP/tsc-files.txt"
          if ! grep -q '/locveil-bridge/contracts/pins/workbench/contract\.ts$' "$RUNNER_TEMP/tsc-files.txt"; then
            echo "::error::tsc did not compile contracts/pins/workbench/contract.ts - the plugin contract must resolve to the pinned file (tsconfig.json paths)"
            exit 1
          fi
          if grep '/locveil-commons/' "$RUNNER_TEMP/tsc-files.txt" | grep -v '/locveil-commons/packages/ui-kit/'; then
            echo "::error::tsc compiled the commons files listed above - only packages/ui-kit may come from the sibling checkout; the plugin contract comes from contracts/pins/workbench/"
            exit 1
          fi
          if grep '/node_modules/locveil-workbench/' "$RUNNER_TEMP/tsc-files.txt"; then
            echo "::error::a locveil-workbench package is installed and compiled - the plugin contract comes from contracts/pins/workbench/ only"
            exit 1
          fi
          echo "ok: the plugin contract compiles from contracts/pins/workbench/contract.ts"

  # ----------------------- gated ARM image builds (slow; manual workflow_dispatch) ---
  # Builds linux/arm/v7 images for backend + UI and PUSHES them to GHCR.
  #   ghcr.io/locveil/locveil-bridge:<tag>   (backend)
  #   ghcr.io/locveil/locveil-bridge-ui:<tag>       (UI)
  # Tags emitted per build: `latest`, `sha-<short>`, `vYYYYMMDD-<short>`.
  # Auth is the workflow's built-in GITHUB_TOKEN (no separate PAT). On first push,
  # the packages will be PRIVATE — flip to public in repo Settings → Packages so
  # the WB pulls anonymously. See ops/INSTALL.md.
  backend-build-arm:
    name: Backend ARM image (GHCR push)
    runs-on: ubuntu-latest
    # contract-guard carries the release staleness gate (--fail-on minor on dispatch).
    needs: [backend-test, contract-guard]
    if: github.event_name == 'workflow_dispatch' && inputs.build_backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/locveil-bridge
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=v{{date 'YYYYMMDD'}}-{{sha}}
      - name: Build + push backend ARM image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            ARCH=arm32v7
            LEAN=true

  ui-image:
    name: UI ARM image (GHCR push)
    runs-on: ubuntu-latest
    # contract-guard carries the release staleness gate (--fail-on minor on dispatch).
    needs: [ui-validate, contract-guard]
    if: github.event_name == 'workflow_dispatch' && inputs.build_ui
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/locveil-bridge-ui
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=v{{date 'YYYYMMDD'}}-{{sha}}
      - name: Build + push UI ARM image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ui
          platforms: linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

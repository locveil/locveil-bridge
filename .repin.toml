# repin config for locveil-bridge (OPS-33; v2 shape since OPS-39 — vendored
# scripts/repin.py at repin-v2.0.0; never edit the vendored file, re-vendor to move).
# Families this repo CONSUMES + the vendored-tools manifest. No `files` lists: the
# owner's STAMP `artifacts` at the tag enumerate the pin set. Severity ladder
# (../locveil-commons/process/contracts.md §5): pre-commit warns (--fail-on none);
# ordinary CI fails on a major gap / never-pinned family plus touch-the-family
# (--fail-on major --touched <push base>); the image-dispatch path fails on a
# minor-or-major family gap (--fail-on minor); vendored-tool version gaps fail only
# under --fail-on any (manual: python3 scripts/repin.py --check --fail-on any).
# Owned families (catalog, device-integration) never appear here: repin tracks what
# this repo consumes, not what it cuts.

[repin]
pinned_by = "locveil-bridge scripts/repin.py (OPS-33)"
default_fail_on = "major"

[[family]]
name = "report-protocol"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
[[family.dest]]
path = "contracts/pins/report-protocol"
conformance = "backend/tests/unit/test_report_protocol_pin.py"

# CORE-7: the estate's first vendored RUNTIME code bridge-side (voice ARCH-58 is the
# sibling). The importable copy backend/src/locveil_bridge/utils/entry_point_loader.py
# must stay byte-identical to the pinned artifact; the conformance test asserts it.
[[family]]
name = "core-py"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
[[family.dest]]
path = "contracts/pins/core-py"
conformance = "backend/tests/unit/test_core_py_pin_identity.py"

# DOC-19 (HK-13): the org-wide docs-manifest vocabulary. docs/manifest.json is
# instance data; this pinned schema is the contract it validates against, hermetically.
[[family]]
name = "docs-manifest-schema"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
[[family.dest]]
path = "contracts/pins/docs-manifest-schema"
conformance = "backend/tests/unit/test_docs_manifest.py"

# UI-22 (HK-13): the Workbench plugin contract — contract types + the two machine
# schemas. workbench-plugin/ compiles against the commons package through a file: link;
# this pin is the versioned statement of what it was built against, and the
# conformance test validates the plugin's emitted manifest against the pinned schema.
[[family]]
name = "workbench"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
[[family.dest]]
path = "contracts/pins/workbench"
conformance = "backend/tests/unit/test_workbench_pin.py"

# Vendored-tools manifest: path + pinned_tag + sha256 are written by
# `python3 scripts/repin.py tool <name>` — never by hand. The tag is checked against
# the owner's newest; the sha256 proves the vendored copy is unedited (a mismatch
# fails at every level but `none`). Re-vendor only in a ledger task.
[[tool]]
name = "scope-guard"
family = "scope"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
path = "scripts/scope_guard.py"
pinned_tag = "scope-v7.3.0"
sha256 = "294cf4111c7e3e1914b6014c88d99558e3cebaeb736341110208d39bf1e76ba7"

[[tool]]
name = "contract-guard"
family = "contract-guard"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
path = "scripts/contract_guard.py"
pinned_tag = "contract-guard-v4.0.0"
sha256 = "51e2a0d1599a2b8e1c3d50538d4f1b4684d8314bc0931b9998d02f36206f74fd"

[[tool]]
name = "repin"
family = "repin"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
path = "scripts/repin.py"
pinned_tag = "repin-v2.0.0"
sha256 = "2e55faa86fe17763610ad1d4280df3daf1de8892d1620149dfc0ffcb876d30c4"
